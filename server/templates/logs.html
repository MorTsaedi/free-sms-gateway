{% extends "base.html" %}

{% block title %}Activity — Relay{% endblock %}

{% block content %}
<div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4 mb-6">
    <div>
        <p class="text-xs font-medium uppercase tracking-[0.16em] text-slate-400 mb-1">History</p>
        <h1 class="font-display text-2xl sm:text-3xl font-semibold text-slate-900">Activity log</h1>
        <p class="text-sm text-slate-500 mt-1">Every message that passed through the gateway.</p>
    </div>
    <div class="flex flex-wrap gap-2">
        <select id="status-filter" class="px-3 py-2 border border-slate-300 rounded-xl text-sm bg-white focus:border-amber-400 focus:ring-4 focus:ring-amber-400/10">
            <option value="">All statuses</option>
            <option value="pending">Queued</option>
            <option value="claimed">Claimed</option>
            <option value="sent">Sent</option>
            <option value="delivered">Delivered</option>
            <option value="failed">Failed</option>
        </select>
        <select id="device-filter" class="px-3 py-2 border border-slate-300 rounded-xl text-sm bg-white focus:border-amber-400 focus:ring-4 focus:ring-amber-400/10">
            <option value="">All devices</option>
        </select>
    </div>
</div>

<div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-slate-100">
            <thead>
                <tr class="text-left text-[11px] font-medium uppercase tracking-[0.12em] text-slate-400">
                    <th class="px-6 py-3">#</th>
                    <th class="px-6 py-3">Device</th>
                    <th class="px-6 py-3">To</th>
                    <th class="px-6 py-3">Message</th>
                    <th class="px-6 py-3">Status</th>
                    <th class="px-6 py-3">Created</th>
                    <th class="px-6 py-3">Sent</th>
                    <th class="px-6 py-3">Error</th>
                </tr>
            </thead>
            <tbody id="logs-table" class="divide-y divide-slate-100">
                <tr><td colspan="8" class="px-6 py-10 text-center text-slate-400">Loading…</td></tr>
            </tbody>
        </table>
    </div>
    <div id="pagination" class="px-6 py-4 border-t border-slate-100 flex flex-wrap items-center justify-center gap-2"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let currentPage = 1;
    const pageSize = 20;

    const STATUS_HEX = { pending:'#f5a524', claimed:'#3b82f6', sent:'#3b82f6', delivered:'#22b57a', failed:'#e5484d' };
    const STATUS_LABEL = { pending:'Queued', claimed:'Claimed', sent:'Sent', delivered:'Delivered', failed:'Failed' };
    function statusBadge(st){
        const c = STATUS_HEX[st] || '#94a3b8';
        return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-medium" style="background:${c}1a;color:${c}">
            <span class="w-1.5 h-1.5 rounded-full" style="background:${c}"></span>${STATUS_LABEL[st] || st}</span>`;
    }

    async function loadLogs(){
        const tbody = document.getElementById('logs-table');
        try{
            const status = document.getElementById('status-filter').value;
            const deviceId = document.getElementById('device-filter').value;
            let url = `/api/v1/sms/queue?page=${currentPage}&page_size=${pageSize}`;
            if(status) url += `&status=${status}`;
            if(deviceId) url += `&device_id=${deviceId}`;

            const data = await api(url);

            if(!data.items.length){
                tbody.innerHTML = '<tr><td colspan="8" class="px-6 py-12 text-center text-slate-400 text-sm">Nothing here — adjust the filters or send a message.</td></tr>';
            } else {
                tbody.innerHTML = data.items.map(s=>`
                    <tr class="hover:bg-slate-50/60 transition">
                        <td class="px-6 py-3.5 font-mono text-xs text-slate-400">#${s.id}</td>
                        <td class="px-6 py-3.5 text-sm text-slate-700">${deviceName(s.device_id)}</td>
                        <td class="px-6 py-3.5 font-mono text-sm text-slate-800">${esc(s.to_number)}</td>
                        <td class="px-6 py-3.5"><span class="text-sm text-slate-600 max-w-[220px] block truncate" title="${esc(s.message)}">${esc(s.message)}</span></td>
                        <td class="px-6 py-3.5">${statusBadge(s.status)}</td>
                        <td class="px-6 py-3.5 text-sm text-slate-500 whitespace-nowrap">${new Date(s.created_at).toLocaleString()}</td>
                        <td class="px-6 py-3.5 text-sm text-slate-500 whitespace-nowrap">${s.sent_at ? new Date(s.sent_at).toLocaleString() : '—'}</td>
                        <td class="px-6 py-3.5 text-sm text-red-500 max-w-[140px] truncate" title="${esc(s.error_message)}">${s.error_message ? esc(s.error_message) : '—'}</td>
                    </tr>`).join('');
            }
            renderPagination(data.total, data.page, data.page_size);
        }catch(e){
            if(e.status!==401) tbody.innerHTML = `<tr><td colspan="8" class="px-6 py-10 text-center text-red-500 text-sm">Couldn’t load activity: ${esc(e.message)}</td></tr>`;
        }
    }

    const deviceCache = {};
    function deviceName(id){
        const d = deviceCache[id];
        return d !== undefined ? d : `#${id}`;
    }

    async function loadDeviceFilter(){
        try{
            const devices = await api('/api/v1/admin/devices');
            devices.forEach(d=> deviceCache[d.id] = d.name);
            const select = document.getElementById('device-filter');
            const cur = select.value;
            select.innerHTML = '<option value="">All devices</option>' + devices.map(d=>`<option value="${d.id}" ${String(d.id)===cur?'selected':''}>${esc(d.name)}</option>`).join('');
            if(cur && cur !== '') loadLogs();
        }catch(e){}
    }

    function pageButton(label, target, disabled){
        // Build the class list with string concatenation — the previous version escaped
        // nested double-quotes inside a ${...} ternary, which threw a JS SyntaxError and
        // left the Activity page stuck on "Loading…".
        const cls = ['px-3','py-1.5','rounded-lg','text-sm'];
        if(disabled){
            cls.push('opacity-40','cursor-not-allowed','border','border-slate-200');
        } else {
            cls.push('border','border-slate-200','hover:bg-slate-50');
        }
        const attr = disabled ? 'disabled ' : '';
        return '<button ' + attr + 'onclick="changePage(' + target + ')" class="' + cls.join(' ') + '">' + label + '</button>';
    }

    function renderPagination(total, page, ps){
        const totalPages = Math.ceil(total/ps);
        const box = document.getElementById('pagination');
        if(totalPages <= 1){ box.innerHTML = ''; return; }
        let html = '';
        html += pageButton('← Prev', page-1, page<=1);
        for(let i=Math.max(1,page-2); i<=Math.min(totalPages,page+2); i++){
            const active = i===page;
            html += '<button onclick="changePage(' + i + ')" class="px-3 py-1.5 rounded-lg text-sm ' +
                (active ? 'bg-[#0b1320] text-white' : 'border border-slate-200 hover:bg-slate-50') +
                '">' + i + '</button>';
        }
        html += pageButton('Next →', page+1, page>=totalPages);
        box.innerHTML = html;
    }

    function changePage(p){ currentPage = p; loadLogs(); }

    document.getElementById('status-filter').addEventListener('change', ()=>{ currentPage=1; loadLogs(); });
    document.getElementById('device-filter').addEventListener('change', ()=>{ currentPage=1; loadLogs(); });

    async function refresh(){ await Promise.all([loadDeviceFilter(), loadLogs()]); }
    document.addEventListener('DOMContentLoaded', () => { if(!getKey()) showAuth(); else refresh(); });
</script>
{% endblock %}
