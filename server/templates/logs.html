{% extends "base.html" %}

{% block title %}Logs - SMS Gateway{% endblock %}

{% block content %}
<div class="mb-8">
    <h2 class="text-2xl font-bold text-gray-900">SMS Activity Logs</h2>
    <p class="text-gray-600 mt-1">Recent SMS sending activity</p>
</div>

<div class="bg-white rounded-lg shadow">
    <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
        <h3 class="text-lg font-medium text-gray-900">Recent SMS</h3>
        <div class="flex space-x-2">
            <select id="status-filter" class="px-3 py-1 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">All Statuses</option>
                <option value="pending">Pending</option>
                <option value="sent">Sent</option>
                <option value="delivered">Delivered</option>
                <option value="failed">Failed</option>
            </select>
            <select id="device-filter" class="px-3 py-1 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">All Devices</option>
            </select>
        </div>
    </div>
    <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Device</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">To</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Message</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Created</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Sent</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Error</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200" id="logs-table">
                <tr>
                    <td colspan="8" class="px-6 py-4 text-center text-gray-500">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="px-6 py-4 border-t border-gray-200 flex justify-center" id="pagination">
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let currentPage = 1;
    const pageSize = 20;

    async function loadLogs() {
        try {
            const status = document.getElementById('status-filter').value;
            const deviceId = document.getElementById('device-filter').value;
            
            let url = `/api/v1/sms/queue?page=${currentPage}&page_size=${pageSize}`;
            if (status) url += `&status=${status}`;
            if (deviceId) url += `&device_id=${deviceId}`;
            
            const response = await fetch(url, {
                headers: { 'X-API-Key': localStorage.getItem('admin_api_key') }
            });
            const data = await response.json();
            
            const tbody = document.getElementById('logs-table');
            if (data.items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="px-6 py-4 text-center text-gray-500">No SMS logs found</td></tr>';
            } else {
                tbody.innerHTML = data.items.map(sms => `
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${sms.id}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${sms.device_id}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${sms.to_number}</td>
                        <td class="px-6 py-4 text-sm text-gray-900 max-w-xs truncate">${sms.message}</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="inline-flex px-2 py-1 text-xs font-semibold rounded-full ${getStatusClass(sms.status)}">
                                ${sms.status}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${new Date(sms.created_at).toLocaleString()}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${sms.sent_at ? new Date(sms.sent_at).toLocaleString() : '-'}</td>
                        <td class="px-6 py-4 text-sm text-gray-500 max-w-xs truncate">${sms.error_message || '-'}</td>
                    </tr>
                `).join('');
            }
            
            renderPagination(data.total, data.page, data.page_size);
            await loadDeviceFilter();
        } catch (e) {
            console.error('Failed to load logs', e);
        }
    }

    function getStatusClass(status) {
        switch (status) {
            case 'pending': return 'bg-yellow-100 text-yellow-800';
            case 'sent': return 'bg-blue-100 text-blue-800';
            case 'delivered': return 'bg-green-100 text-green-800';
            case 'failed': return 'bg-red-100 text-red-800';
            default: return 'bg-gray-100 text-gray-800';
        }
    }

    async function loadDeviceFilter() {
        try {
            const response = await fetch('/api/v1/admin/devices', {
                headers: { 'X-API-Key': localStorage.getItem('admin_api_key') }
            });
            const devices = await response.json();
            
            const select = document.getElementById('device-filter');
            const currentValue = select.value;
            select.innerHTML = '<option value="">All Devices</option>' + devices
                .map(d => `<option value="${d.id}" ${d.id == currentValue ? 'selected' : ''}>${d.name}</option>`)
                .join('');
        } catch (e) {
            console.error('Failed to load devices for filter', e);
        }
    }

    function renderPagination(total, page, pageSize) {
        const totalPages = Math.ceil(total / pageSize);
        const pagination = document.getElementById('pagination');
        
        if (totalPages <= 1) {
            pagination.innerHTML = '';
            return;
        }
        
        let html = '';
        if (page > 1) {
            html += `<button onclick="changePage(${page - 1})" class="px-3 py-1 text-sm border border-gray-300 rounded-lg hover:bg-gray-50">Previous</button>`;
        }
        
        for (let i = Math.max(1, page - 2); i <= Math.min(totalPages, page + 2); i++) {
            html += `<button onclick="changePage(${i})" class="px-3 py-1 text-sm ${i === page ? 'bg-blue-600 text-white' : 'border border-gray-300 text-gray-700 hover:bg-gray-50'} rounded-lg">${i}</button>`;
        }
        
        if (page < totalPages) {
            html += `<button onclick="changePage(${page + 1})" class="px-3 py-1 text-sm border border-gray-300 rounded-lg hover:bg-gray-50">Next</button>`;
        }
        
        pagination.innerHTML = html;
    }

    function changePage(page) {
        currentPage = page;
        loadLogs();
    }

    document.getElementById('status-filter').addEventListener('change', () => {
        currentPage = 1;
        loadLogs();
    });

    document.getElementById('device-filter').addEventListener('change', () => {
        currentPage = 1;
        loadLogs();
    });

    document.addEventListener('DOMContentLoaded', () => {
        if (!localStorage.getItem('admin_api_key')) {
            const key = prompt('Enter your admin API key:');
            if (key) localStorage.setItem('admin_api_key', key);
        }
        loadLogs();
    });
</script>
{% endblock %}
