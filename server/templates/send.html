{% extends "base.html" %}

{% block title %}Send SMS - SMS Gateway{% endblock %}

{% block content %}
<div class="mb-8">
    <h2 class="text-2xl font-bold text-gray-900">Send SMS</h2>
    <p class="text-gray-600 mt-1">Queue an SMS message to be sent by a device</p>
</div>

<div class="bg-white rounded-lg shadow p-6 mb-8 max-w-2xl">
    <form id="send-form" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Device</label>
            <select id="device-select" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                <option value="">Select a device</option>
            </select>
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">To Number</label>
            <input type="tel" id="to-number" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="+1234567890" required>
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Message</label>
            <textarea id="message" rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Your message here..." required></textarea>
        </div>
        
        <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition">Send SMS</button>
    </form>
    
    <div id="send-result" class="mt-4 hidden p-4 rounded-lg"></div>
</div>

<div class="bg-white rounded-lg shadow">
    <div class="px-6 py-4 border-b border-gray-200">
        <h3 class="text-lg font-medium text-gray-900">Recent SMS Queue</h3>
    </div>
    <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Device</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">To</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Message</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Created</th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200" id="sms-table">
                <tr>
                    <td colspan="6" class="px-6 py-4 text-center text-gray-500">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function loadDevices() {
        try {
            const response = await fetch('/api/v1/admin/devices', {
                headers: { 'X-API-Key': localStorage.getItem('admin_api_key') }
            });
            const devices = await response.json();
            
            const select = document.getElementById('device-select');
            select.innerHTML = '<option value="">Select a device</option>' + devices
                .filter(d => d.status === 'online')
                .map(d => `<option value="${d.id}">${d.name} (${d.status})</option>`)
                .join('');
        } catch (e) {
            console.error('Failed to load devices', e);
        }
    }

    async function loadSMSQueue() {
        try {
            const response = await fetch('/api/v1/sms/queue?page_size=20', {
                headers: { 'X-API-Key': localStorage.getItem('admin_api_key') }
            });
            const data = await response.json();
            
            const tbody = document.getElementById('sms-table');
            if (data.items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-4 text-center text-gray-500">No SMS in queue</td></tr>';
                return;
            }
            
            tbody.innerHTML = data.items.map(sms => `
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${sms.device_id}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${sms.to_number}</td>
                    <td class="px-6 py-4 text-sm text-gray-900 max-w-xs truncate">${sms.message}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="inline-flex px-2 py-1 text-xs font-semibold rounded-full ${getStatusClass(sms.status)}">
                            ${sms.status}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${new Date(sms.created_at).toLocaleString()}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        ${sms.status === 'failed' ? `<button onclick="retrySMS(${sms.id})" class="text-blue-600 hover:text-blue-900 mr-3">Retry</button>` : ''}
                        <button onclick="deleteSMS(${sms.id})" class="text-red-600 hover:text-red-900">Delete</button>
                    </td>
                </tr>
            `).join('');
        } catch (e) {
            console.error('Failed to load SMS queue', e);
        }
    }

    function getStatusClass(status) {
        switch (status) {
            case 'pending': return 'bg-yellow-100 text-yellow-800';
            case 'sent': return 'bg-blue-100 text-blue-800';
            case 'delivered': return 'bg-green-100 text-green-800';
            case 'failed': return 'bg-red-100 text-red-800';
            default: return 'bg-gray-100 text-gray-800';
        }
    }

    document.getElementById('send-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const deviceId = document.getElementById('device-select').value;
        const toNumber = document.getElementById('to-number').value;
        const message = document.getElementById('message').value;
        
        if (!deviceId || !toNumber || !message) {
            return alert('Please fill all fields');
        }
        
        try {
            const response = await fetch('/api/v1/sms/send', {
                method: 'POST',
                headers: { 
                    'X-API-Key': localStorage.getItem('admin_api_key'),
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ device_id: parseInt(deviceId), to_number: toNumber, message })
            });
            
            const resultDiv = document.getElementById('send-result');
            if (response.ok) {
                resultDiv.className = 'mt-4 p-4 rounded-lg bg-green-50 text-green-800';
                resultDiv.textContent = 'SMS queued successfully!';
                resultDiv.classList.remove('hidden');
                document.getElementById('send-form').reset();
                loadSMSQueue();
            } else {
                const err = await response.json();
                resultDiv.className = 'mt-4 p-4 rounded-lg bg-red-50 text-red-800';
                resultDiv.textContent = 'Error: ' + err.detail;
                resultDiv.classList.remove('hidden');
            }
        } catch (e) {
            console.error('Failed to send SMS', e);
        }
    });

    async function retrySMS(id) {
        try {
            const response = await fetch(`/api/v1/sms/retry/${id}`, {
                method: 'POST',
                headers: { 'X-API-Key': localStorage.getItem('admin_api_key') }
            });
            if (response.ok) loadSMSQueue();
        } catch (e) {
            console.error('Failed to retry SMS', e);
        }
    }

    async function deleteSMS(id) {
        if (!confirm('Delete this SMS from queue?')) return;
        
        try {
            const response = await fetch(`/api/v1/sms/${id}`, {
                method: 'DELETE',
                headers: { 'X-API-Key': localStorage.getItem('admin_api_key') }
            });
            if (response.ok) loadSMSQueue();
        } catch (e) {
            console.error('Failed to delete SMS', e);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        if (!localStorage.getItem('admin_api_key')) {
            const key = prompt('Enter your admin API key:');
            if (key) localStorage.setItem('admin_api_key', key);
        }
        loadDevices();
        loadSMSQueue();
        setInterval(loadSMSQueue, 10000);
    });
</script>
{% endblock %}
